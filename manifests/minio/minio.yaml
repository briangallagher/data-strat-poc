# MinIO for pipeline intermediate storage (chunks + artifacts)
# Separate from Milvus's internal MinIO
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-service
  namespace: data-strat-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio-service
  template:
    metadata:
      labels:
        app: minio-service
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          command: ["minio", "server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minio
            - name: MINIO_ROOT_PASSWORD
              value: minio123
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio-service
  namespace: data-strat-poc
spec:
  selector:
    app: minio-service
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
