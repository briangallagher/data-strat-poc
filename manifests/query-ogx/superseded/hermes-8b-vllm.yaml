apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-70b-vllm
  namespace: data-strat-poc
  labels:
    app: llama-70b-vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-70b-vllm
  template:
    metadata:
      labels:
        app: llama-70b-vllm
    spec:
      nodeSelector:
        kubernetes.io/hostname: dev-cfsxt-gpu-workers-eugb3-kz5cm
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: registry.redhat.io/rhaii/vllm-cuda-rhel9@sha256:ad06abf3bb5235ebb5b2df84cd1b9fd09e823f0ff2eebfc82bb4590275ccfe0b
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - "--port=8080"
            - "--model=NousResearch/Hermes-3-Llama-3.1-8B"
            - "--served-model-name=hermes-8b"
            - "--max-model-len=8192"
            - "--tensor-parallel-size=1"
            - "--enable-auto-tool-choice"
            - "--tool-call-parser=hermes"
            - "--download-dir=/tmp/models"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token-secret
                  key: token
            - name: HF_HOME
              value: /tmp/hf_home
            - name: HF_HUB_OFFLINE
              value: "0"
            - name: HF_HUB_ENABLE_HF_TRANSFER
              value: "0"
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "4"
              memory: "24Gi"
              nvidia.com/gpu: "1"
              ephemeral-storage: "25Gi"
            limits:
              nvidia.com/gpu: "1"
              ephemeral-storage: "30Gi"
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llama-70b-vllm
  namespace: data-strat-poc
  labels:
    app: llama-70b-vllm
spec:
  selector:
    app: llama-70b-vllm
  ports:
    - port: 8080
      targetPort: 8080
