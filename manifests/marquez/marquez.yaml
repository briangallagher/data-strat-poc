# Marquez OpenLineage backend
# Adapted from rh-waterford-et/lineage-demo-pipeline
# Deployed to data-strat-poc namespace (same as pipeline -- DEC-005)
#
# Components: PostgreSQL (metadata store) + Marquez API + Marquez Web UI
# PG-001: No auth -- accept for M2, add OAuth proxy in M5
# PG-022: Same namespace as pipeline -- isolate in M5
---
apiVersion: v1
kind: Secret
metadata:
  name: marquez-db-secret
  namespace: data-strat-poc
type: Opaque
stringData:
  POSTGRESQL_USER: marquez
  POSTGRESQL_PASSWORD: marquez123
  POSTGRESQL_DATABASE: marquez
---
apiVersion: v1
kind: Secret
metadata:
  name: marquez-secret
  namespace: data-strat-poc
type: Opaque
stringData:
  marquez-db-password: marquez123
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marquez-db-pvc
  namespace: data-strat-poc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: marquez-config
  namespace: data-strat-poc
data:
  config.yml: |
    server:
      applicationConnectors:
        - type: http
          port: ${MARQUEZ_PORT:-5000}
      adminConnectors:
        - type: http
          port: ${MARQUEZ_ADMIN_PORT:-5001}
    db:
      driverClass: org.postgresql.Driver
      url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
    dbRetention:
      frequencyMins: 15
      retentionDays: 7
    migrateOnStartup: ${MIGRATE_ON_STARTUP:-true}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez-db
  namespace: data-strat-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marquez-db
  template:
    metadata:
      labels:
        app: marquez-db
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: marquez-db-secret
                  key: POSTGRESQL_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marquez-db-secret
                  key: POSTGRESQL_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: marquez-db-secret
                  key: POSTGRESQL_DATABASE
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: marquez-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: marquez-db
  namespace: data-strat-poc
spec:
  selector:
    app: marquez-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez
  namespace: data-strat-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marquez
  template:
    metadata:
      labels:
        app: marquez
    spec:
      containers:
        - name: marquez
          image: docker.io/marquezproject/marquez:0.51.1
          ports:
            - containerPort: 5000
              name: api
            - containerPort: 5001
              name: admin
          env:
            - name: POSTGRES_HOST
              value: marquez-db
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: marquez
            - name: POSTGRES_USER
              value: marquez
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marquez-secret
                  key: marquez-db-password
            - name: MARQUEZ_PORT
              value: "5000"
            - name: MARQUEZ_ADMIN_PORT
              value: "5001"
            - name: MIGRATE_ON_STARTUP
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /usr/src/app/config.yml
              subPath: config.yml
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: marquez-config
---
apiVersion: v1
kind: Service
metadata:
  name: marquez
  namespace: data-strat-poc
spec:
  selector:
    app: marquez
  ports:
    - name: api
      port: 5000
      targetPort: 5000
    - name: admin
      port: 5001
      targetPort: 5001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marquez-web
  namespace: data-strat-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marquez-web
  template:
    metadata:
      labels:
        app: marquez-web
    spec:
      containers:
        - name: marquez-web
          image: docker.io/marquezproject/marquez-web:0.51.1
          ports:
            - containerPort: 3000
          env:
            - name: MARQUEZ_HOST
              value: marquez
            - name: MARQUEZ_PORT
              value: "5000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: marquez-web
  namespace: data-strat-poc
spec:
  selector:
    app: marquez-web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: marquez
  namespace: data-strat-poc
spec:
  to:
    kind: Service
    name: marquez
  port:
    targetPort: api
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: marquez-web
  namespace: data-strat-poc
spec:
  to:
    kind: Service
    name: marquez-web
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
